<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <div class="container">
      <header class="topbar card">
        <h1>Task Manager</h1>
        <button id="themeToggle" class="btn-secondary" type="button">Toggle Dark Mode</button>
      </header>

      <section class="card form-section">
        <h2>Create Task</h2>
        <form id="taskForm" class="task-form">
          <input id="title" type="text" placeholder="Title" required />
          <textarea id="description" placeholder="Description" rows="3"></textarea>
          <select id="priority">
            <option value="High">High</option>
            <option value="Medium" selected>Medium</option>
            <option value="Low">Low</option>
          </select>
          <button class="btn-primary" type="submit">Add Task</button>
          <button id="exportBtn" class="btn-secondary" type="button">Export to Excel</button>
        </form>
      </section>

      <main class="board">
        <section class="column card" data-status="todo">
          <h3>To Do</h3>
          <div class="task-list" id="todoList"></div>
        </section>

        <section class="column card" data-status="doing">
          <h3>Doing</h3>
          <div class="task-list" id="doingList"></div>
        </section>

        <section class="column card" data-status="done">
          <h3>Done</h3>
          <div class="task-list" id="doneList"></div>
        </section>
      </main>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
